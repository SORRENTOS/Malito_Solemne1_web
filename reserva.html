<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destino Cordillera - Reserva y Contacto</title>
    <!-- Bootstrap 5 CSS para componentes responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos personalizada con tus colores -->
    <link rel="stylesheet" href="styles.css">


    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>



</head>
<body>

    <!-- Header y Navegación -->
    <header>
        <div class="logo">
            <h2>Destino Cordillera</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="panoramas.html">Panoramas</a></li>
                <li><a href="alojamiento.html" >Alojamiento y Gastronomía</a></li>
                <li><a href="reserva.html"class = "active">Reserva y Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner Superior -->
    <section class="hero" style="padding: 3rem 1rem;">
        <div class="hero-content">
            <h1>Reserva y Contacto</h1>
            <p>Contacta con nosotros y planea tu merecido descanso en la naturaleza</p>
        </div>
    </section>

    <!-- Contenido Principal -->
    <main class="container my-5">
        
        <section class="mb-4 text-center">
            <h2>Formulario de Contacto</h2>
        </section>

        <div id="root"></div>

    </main>


  <script type="text/babel">
        
        function Revisar_formulario() {
            const [nombre, setNombre] = React.useState('');
            const [apellido, setApellido] = React.useState('');
            const [correo,setCorreo] = React.useState('');
            const [formulario,setFormulario] = React.useState(false)

            //nombre
            let claseNombre = "form-control"; 
            if (nombre.length === 0) {
                claseNombre = "form-control";
            } else if (nombre.length < 3) {
                claseNombre = "form-control is-invalid"; 
            } else {
                claseNombre = "form-control is-valid";
            }

            //apellido
            let claseApellido = "form-control";
            
            if (apellido.length === 0) {
                claseApellido = "form-control";
                
            } else if (apellido.length < 3){
                claseApellido = "form-control is-invalid";
            } else{
                claseApellido = "form-control is-valid";

            }
            //correo
            const [sinEditarAun,setsinEditarAun] = React.useState(true)
            let claseCorreo = "form-control";
            if (correo.includes("@") && sinEditarAun === false) {
                claseCorreo = "form-control is-valid";
            }else if (sinEditarAun === false){
                claseCorreo = "form-control is-invalid";

                
            }


            //checkbox 
            const [marcado,setMarcado] = React.useState(false);
            let claseCheckBox =  "form-control";
            if (marcado === true && presionado ===true) {
                claseCheckBox = "form-control is-valid";
            } else if(marcado ===false && presionado == true){
                claseCheckBox = "form-control is-invalid";
            }


            //BOTON
            const [presionado,setPresionado] = React.useState(false);
            
            if (formulario === true){


                return(
                    <div className="card text-center p-5">
                        <div className="card-body">
                    {/* Cambia la ruta por la de tu imagen real */}
                    <img 
                        src="img/foto_formulario.jpg" 
                        alt="Reserva exitosa" 
                        style={{ maxWidth: '500px', margin: '0 auto', marginBottom: '20px', borderRadius: '30px' }} 
                    />
                    <h3 className="text-success">¡Todo listo!</h3>
                    <p className="lead">Nos pondremos en contacto con usted a la brevedad para confirmar su reserva.</p>
                    
                    {/* Botón opcional por si quieren enviar otra reserva */}
                    <button className="btn btn-outline-primary mt-3"
                            onClick = {(e) => window.location.href = 'index.html'}
                    >
                        Volver al Incio
                    </button>
                </div>
            </div>

                );
            }
            
            return (
                <div className="card">
                    <div className="card-body">
                        <form
                        onSubmit = {(e) => setFormulario(true)}>
                            <div className="row mb-3">
                                
                                {/* APARTADO NOMBRE */}
                                <div className="col-md-4 mb-3">
                                    <label htmlFor="validationServer01">Nombre</label>
                                    <input 
                                        type="text" 
                                        className={claseNombre} /* Aquí conectamos la validación */
                                        id="validationServer01" 
                                        placeholder="Escribe tu nombre" 
                                        value={nombre} /* Conectamos el valor */
                                        onChange={(e) => setNombre(e.target.value)} /* Conectamos el evento (con mayúscula) */
                                        required 
                                    />                    
                                    
                                    {/* Mensajes de feedback */}
                                    {nombre.length > 0 && nombre.length < 3 && (
                                        <div className="invalid-feedback">El nombre debe tener al menos 3 letras.</div>
                                    )}
                                    {nombre.length >= 3 && (
                                        <div className="valid-feedback">¡Se ve bien!</div>
                                    )}
                                </div>
                                
                                <div className="col-md-4 mb-3">
                                    <label htmlFor="validationServer02">Apellidos</label>
                                    <input type="text" 
                                        className={claseApellido} 
                                        id="validationServer02" 
                                        placeholder="Apellido Paterno y Materno"  
                                        value = {apellido}
                                        onChange = {(e) => {
                                            setApellido(e.target.value);
                                        }

                                        }
                                        required />
                                    {/* Mensajes de feedback */}
                                    {apellido.length > 0 && apellido.length < 3 && (
                                        <div className="invalid-feedback">El apellido debe tener al menos 3 letras.</div>
                                    )}
                                    {apellido.length >= 3 && (
                                        <div className="valid-feedback">¡Se ve bien!</div>
                                    )}
                                </div>
                            </div>
 
                            {/* correo */}
                            <div className="row mb-3">
                                <div className="col-md-4 mb-3">
                                    <label htmlFor="validationServer05">Correo electronico</label>
                                    <input type="text" 
                                    className={claseCorreo} 
                                    id="validationServer05" 
                                    placeholder="correo@direccion.com" 
                                    value = {correo}
                                    onChange = {(e) => {
                                        setCorreo(e.target.value);
                                        setsinEditarAun(false);




                                    }}
                                    required />
                                {/* Mensajes de feedback */}
                                    {correo.includes("@") == false &&correo !== "" &&(
                                        <div className="invalid-feedback">Ingrese una direccion de correo valida</div>
                                    )}
                                    {correo.includes("@") == true && (
                                        <div className="valid-feedback">Direccion valida!</div>
                                    )}
                                    {correo === "" && (
                                        <div></div>
                                    )}                                    
                                </div>
                                <div className="col-md-4 mb-3">
                                    <label htmlFor="validationServer03">Ciudad</label>
                                    <input type="text" className="form-control" id="validationServer03" placeholder="Santiago" required />

                                </div>
                                <div className="col-md-4 mb-3">
                                    <label htmlFor="validationServer04">Comuna</label>
                                    <input type="text" className="form-control" id="validationServer04" placeholder="Ingrese su comuna" required />
                                    <div className="invalid-feedback">
                                        Please provide a valid state.
                                    </div>
                                </div>
                                <div className="col-md-4 mb-3">
                                    <label htmlFor="validationServer05">Codigo Postal</label>
                                    <input type="text" className="form-control" id="validationServer05" placeholder="Codigo postal" required />

                                </div>
                                <div className="col-md-4 mb-3">
                                    <label htmlFor="validationServer05">Numero de telefono</label>
                                    <input type="text" className="form-control" id="validationServer05" placeholder="+56 999999999" required />

                                </div>
                            </div>

                            <div className="form-group mb-3">
                                <div className="form-check">
                                    <input 
                                    className={marcado ? "form-check-input is-valid" : "form-check-input is-invalid"}                                    
                                    type="checkbox" 
                                    value="" 
                                    id="invalidCheck3"
                                    checked = {marcado}
                                    onChange = {(e) => setMarcado(e.target.checked)}
                                    required />
                                    <label className="form-check-label" htmlFor="invalidCheck3">
                                        Acepto los terminos y condiciones
                                    </label>
                                    {marcado === false && presionado === true && (
                                    <div className="invalid-feedback">
                                        Debes aceptar los terminos y condiciones para continuar.
                                    </div>
                                    )}

                                </div>
                            </div>
                            
                            <button className="btn btn-primary" type="submit"
                            value = {presionado}
                            onClick = {(e) => setPresionado(true)}

                            
                            >Enviar</button>
                        </form>
                    </div>
                </div>
            );
        }

        // ¡ESTO ERA LO QUE FALTABA PARA QUE APARECIERA!
        const contenedor = document.getElementById('root');
        const root = ReactDOM.createRoot(contenedor);
        root.render(<Revisar_formulario />);

    </script>


    <!-- Footer -->
    <footer>
        <p> 2026 Destino Cordillera - Proyecto de Turismo Local</p>
    </footer>

    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
